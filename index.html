<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Minimal Luxury Date Widget</title>

  <style>
    :root {
      /* Теплий молочно-пудровий фон */
      --ivory-top: #FFFEFC;
      --ivory-middle: #FDF8F4;
      --ivory-bottom: #FBF4EF;

      /* Кольори, узгоджені з обкладинкою */
      --sage: #748169;
      --terracotta: #C98263;
      --charcoal: #30312F;

      /* Легкі рамки */
      --outer-border: rgba(201, 130, 99, 0.15);
      --inner-border: rgba(201, 130, 99, 0.035);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      width: 310px;
      height: 132px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      background: transparent;

      font-family: Georgia, "Times New Roman", serif;
    }

    .date-widget {
      position: relative;

      width: 300px;
      height: 112px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 15px 24px;

      overflow: hidden;

      border: 1px solid var(--outer-border);
      border-radius: 23px;

      background: linear-gradient(
        180deg,
        var(--ivory-top) 0%,
        var(--ivory-middle) 55%,
        var(--ivory-bottom) 100%
      );

      box-shadow:
        0 4px 12px rgba(91, 72, 59, 0.015),
        0 1px 3px rgba(91, 72, 59, 0.018),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    /* Майже непомітна внутрішня рамка */
    .date-widget::before {
      content: "";

      position: absolute;
      inset: 8px;

      border: 1px solid var(--inner-border);
      border-radius: 17px;

      pointer-events: none;
    }

    /* Делікатний світлий відблиск угорі */
    .date-widget::after {
      content: "";

      position: absolute;
      top: 0;
      left: 50%;

      width: 64%;
      height: 1px;

      transform: translateX(-50%);

      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.78) 50%,
        transparent 100%
      );

      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      text-align: center;
    }

    .today-label {
      margin: 0 0 7px;

      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 9px;
      line-height: 1;
      font-weight: 600;

      letter-spacing: 0.38em;
      text-transform: uppercase;

      color: var(--terracotta);
    }

    .main-date {
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      line-height: 0.95;
      font-weight: 400;

      letter-spacing: -0.035em;

      color: var(--charcoal);
    }

    .divider {
      width: 32px;
      height: 1px;

      margin: 9px auto 7px;

      background: rgba(201, 130, 99, 0.30);
    }

    .weekday {
      margin: 0;

      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 9px;
      line-height: 1;
      font-weight: 600;

      letter-spacing: 0.30em;
      text-transform: uppercase;

      color: var(--sage);
    }
  </style>
</head>

<body>
  <div class="date-widget">
    <div class="content">
      <p class="today-label">
        Today
      </p>

      <h1 class="main-date" id="main-date">
        July 16
      </h1>

      <div class="divider"></div>

      <p class="weekday" id="weekday">
        Thursday
      </p>
    </div>
  </div>

  <script>
    const today = new Date();

    const mainDate = today.toLocaleDateString("en-US", {
      month: "long",
      day: "numeric"
    });

    const weekday = today.toLocaleDateString("en-US", {
      weekday: "long"
    });

    document.getElementById("main-date").textContent = mainDate;
    document.getElementById("weekday").textContent = weekday;
  </script>
</body>
</html>
