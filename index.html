<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Widget</title>

  <style>
    :root {
      --cream: #fbf7ef;
      --cream-light: #fffdf8;
      --sage: #6f8064;
      --charcoal: #2f3030;
      --border: rgba(132, 143, 118, 0.14);
      --shadow: rgba(74, 68, 61, 0.035);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    .date-widget {
      width: 420px;
      height: 130px;
      position: relative;
      overflow: hidden;

      border-radius: 28px;
      border: 1px solid var(--border);

      background:
        radial-gradient(circle at 35% 20%, rgba(255, 255, 255, 0.85), transparent 42%),
        linear-gradient(135deg, var(--cream-light) 0%, var(--cream) 100%);

      box-shadow:
        0 4px 12px var(--shadow),
        inset 0 0 0 1px rgba(255, 255, 255, 0.45);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 18px 34px;
    }

    .weekday {
      margin: 0 0 5px;

      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1;
      letter-spacing: 0.30em;
      text-transform: uppercase;

      color: var(--sage);
      font-weight: 700;
    }

    .date {
      margin: 0;

      font-size: 46px;
      line-height: 0.95;
      letter-spacing: -0.035em;

      color: var(--charcoal);
      font-weight: 500;
    }

    .botanical-img {
      position: absolute;
      right: 17px;
      bottom: 9px;

      width: 76px;
      height: auto;

      opacity: 0.92;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 520px) {
      .date-widget {
        width: 92vw;
        height: 126px;
        border-radius: 26px;
      }

      .weekday {
        font-size: 15px;
        letter-spacing: 0.26em;
      }

      .date {
        font-size: 40px;
      }

      .botanical-img {
        width: 64px;
        right: 14px;
        bottom: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="date-widget">
    <p class="weekday" id="weekday">THURSDAY</p>
    <h1 class="date" id="date">May 21</h1>

    <img
      class="botanical-img"
      src="botanical-branch.png"
      alt=""
    />
  </div>

  <script>
    const today = new Date();

    const weekday = today.toLocaleDateString("en-US", {
      weekday: "long"
    }).toUpperCase();

    const date = today.toLocaleDateString("en-US", {
      month: "long",
      day: "numeric"
    });

    document.getElementById("weekday").textContent = weekday;
    document.getElementById("date").textContent = date;
  </script>
</body>
</html>
