<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            /* Цей рядок прибирає чорні смуги прокрутки */
            overflow: hidden; 
        }

        .widget {
            background-color: #f8f5f0; /* Ваш бежевий фон */
            /* Трохи менші відступи, щоб влізало в малі блоки */
            padding: 20px; 
            border-radius: 24px;
            text-align: center;
            min-width: 120px;
            /* Гарантує, що контент не вийде за межі */
            box-sizing: border-box; 
        }

        #day {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #a19d97;
            margin-bottom: 4px;
            font-weight: 500;
        }

        #date {
            font-size: 24px;
            font-weight: 700;
            color: #33312e;
            line-height: 1.1;
            font-family: 'Charter', 'Georgia', serif;
        }
    </style>
</head>
<body>

    <div class="widget">
        <div id="day"></div>
        <div id="date"></div>
    </div>

    <script>
        function updateWidget() {
            const now = new Date();
            const dayOptions = { weekday: 'long' };
            const dateOptions = { month: 'long', day: 'numeric' };

            document.getElementById('day').innerText = now.toLocaleDateString('en-US', dayOptions);
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', dateOptions);
        }
        updateWidget();
        setInterval(updateWidget, 3600000);
    </script>
</body>
</html>
