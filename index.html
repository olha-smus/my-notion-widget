<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Widget</title>

  <style>
    :root {
  --cream: #fbf7ef;
  --cream-light: #fffdf8;
  --sage: #6f8064;
  --charcoal: #2f3030;
  --border: rgba(132, 143, 118, 0.13);
  --shadow: rgba(74, 68, 61, 0.028);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* важливо: дає повітря, щоб краї картки не обрізались */
  padding: 18px 22px;

  background: transparent;
  overflow: visible;
  font-family: Georgia, "Times New Roman", serif;
}

.date-widget {
  width: min(370px, calc(100vw - 44px));
  height: 118px;
  position: relative;
  overflow: hidden;

  border-radius: 24px;
  border: 1px solid var(--border);

  background:
    radial-gradient(circle at 34% 18%, rgba(255, 255, 255, 0.82), transparent 42%),
    linear-gradient(135deg, var(--cream-light) 0%, var(--cream) 100%);

  box-shadow:
    0 2px 8px var(--shadow),
    inset 0 0 0 1px rgba(255, 255, 255, 0.35);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  /* більше місця справа під гілочку */
  padding: 16px 72px 16px 34px;
}

.weekday {
  margin: 0 0 5px;

  font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1;
  letter-spacing: 0.30em;
  text-transform: uppercase;

  color: var(--sage);
  font-weight: 700;
}

.date {
  margin: 0;

  font-size: 40px;
  line-height: 0.95;
  letter-spacing: -0.035em;

  color: var(--charcoal);
  font-weight: 500;
}

.botanical-img {
  position: absolute;
  right: 22px;
  bottom: 12px;

  width: 58px;
  height: auto;

  opacity: 0.92;
  pointer-events: none;
  user-select: none;
}

@media (max-width: 520px) {
  body {
    padding: 16px;
  }

  .date-widget {
    width: min(350px, calc(100vw - 32px));
    height: 112px;
    border-radius: 22px;
    padding: 15px 64px 15px 28px;
  }

  .weekday {
    font-size: 13px;
    letter-spacing: 0.26em;
  }

  .date {
    font-size: 36px;
  }

  .botanical-img {
    width: 52px;
    right: 18px;
    bottom: 10px;
  }
}
  </style>
</head>

<body>
  <div class="date-widget">
    <p class="weekday" id="weekday">THURSDAY</p>
    <h1 class="date" id="date">May 21</h1>

    <img
      class="botanical-img"
      src="botanical-branch.png"
      alt=""
    />
  </div>

  <script>
    const today = new Date();

    const weekday = today.toLocaleDateString("en-US", {
      weekday: "long"
    }).toUpperCase();

    const date = today.toLocaleDateString("en-US", {
      month: "long",
      day: "numeric"
    });

    document.getElementById("weekday").textContent = weekday;
    document.getElementById("date").textContent = date;
  </script>
</body>
</html>
